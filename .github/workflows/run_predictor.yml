name: Run F1 Predictor Pipeline
on:
  workflow_dispatch: 
  schedule:
    - cron: '0 10 * * 2' 

# This explicitly grants the robot write access via code configuration
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo code
      uses: actions/checkout@v4 # Updated to v4 for Node 24 support

    - name: Set up Python
      uses: actions/setup-python@v5 # Updated to v5 for Node 24 support
      with:
        python-version: '3.10'

    - name: Install Tools
      run: |
        pip install -r requirements.txt

    - name: Run AI Engine
      run: python predictor.py

    - name: Commit and Save Predictions File
      run: |
        git config --global user.name 'F1 Predictor Bot'
        git config --global user.email 'bot@github.com'
        git add predictions.json
        git commit -m "Automated AI Prediction Update" || echo "No changes to commit"
        git push
